<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>建築知識庫(Sample)</title>
<link rel="stylesheet" href="/studio-kit.css">
<style>
  .kb-root { padding: 12px; }
  .showcase-banner { background: #f5f5f5; border-left: 3px solid #bbb; padding: 6px 10px; margin-bottom: 10px; font-size: 12px; color: #666; }
  .cap-label { font-size: 11px; color: #999; margin-bottom: 4px; }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
  .filter-bar input, .filter-bar select { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  .filter-bar label { font-size: 12px; color: #555; }
  .kb-root table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .kb-root th, .kb-root td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e0e0e0; font-size: 14px; vertical-align: top; overflow: hidden; }
  .kb-root th { background: #f8f8f8; font-weight: bold; position: relative; white-space: nowrap; }
  .ext-link { font-size: 12px; color: #1565c0; cursor: pointer; white-space: nowrap; }
  .ext-link:hover { text-decoration: underline; }
  .notice { color: #b00020; margin-bottom: 8px; font-size: 14px; }
  .error { color: #b00020; }
  .summary { margin-bottom: 4px; color: #555; font-size: 13px; }
  .attribution { margin-top: 18px; padding: 10px; background: #f5f5f5; border-left: 3px solid #bbb; font-size: 12px; color: #666; line-height: 1.6; }
  .attribution a { color: #1565c0; }
  /* pagination controls */
  .pagination { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; font-size: 13px; }
  .pagination button { padding: 3px 9px; border: 1px solid #ccc; border-radius: 3px; background: #fff; cursor: pointer; font-size: 13px; }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .pagination button:not(:disabled):hover { background: #e8eaf6; }
  .pagination .page-info { color: #555; }
  .pagination select { padding: 2px 6px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; }
  /* col-resize handle */
  .col-resize-handle {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 5px; cursor: col-resize;
    user-select: none;
  }
  .col-resize-handle:hover, .col-resize-handle.dragging { background: #1565c0; opacity: 0.4; }
</style>
</head>
<body>
<div class="kb-root">
  <!-- showcase banner -->
  <div class="showcase-banner">Studio 外掛範例 — 示範:公共資料源查詢、站內篩選/分頁、欄寬調整、深連結</div>

  <!-- Skills section -->
  <div id="section-skills">
    <div class="cap-label">示範:站內即時篩選</div>
    <div class="filter-bar">
      <label>類別 <select id="skill-category"><option value="">全部</option></select></label>
      <label>狀態 <select id="skill-status"><option value="">全部</option></select></label>
      <label>關鍵字 <input type="text" id="skill-keyword" placeholder="名稱/說明" style="width:160px"></label>
    </div>
    <div id="skill-notice" class="notice" hidden></div>
    <div id="skill-summary" class="summary">載入中…</div>
    <div class="cap-label">示範:站內分頁</div>
    <div id="skill-pagination-top" class="pagination"></div>
    <div id="skill-list"></div>
    <div class="cap-label" style="margin-top:6px">示範:欄位寬度可拖曳調整</div>
    <div id="skill-pagination-bottom" class="pagination"></div>
  </div>

  <!-- attribution footer -->
  <div class="attribution">
    資料來源:HJPLUS 台灣 AEC 開源知識庫(<a href="https://github.com/h30190/HJPLUS_Taiwan_Architect_KB" target="_blank" rel="noopener">github.com/h30190/HJPLUS_Taiwan_Architect_KB</a>),內容授權 CC BY-SA 4.0;本外掛之資料 artifact 依同授權再散布並標示出處。
  </div>
</div>
<script src="/studio-plugin.js"></script>
<script>
(function () {
  var SKILL_BLOCK = "kb-skills";

  // ---- utils ----
  function clearElement(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  function truncate(s, max) {
    if (!s) return "";
    return s.length > max ? s.slice(0, max) + "…" : s;
  }

  // ---- pagination state ----
  // NOTE(ceiling): page state is per-session only; no URL persistence for current page number.
  var skillPage = { current: 1, pageSize: 50 };

  function buildPagination(state, totalFiltered, totalAll, renderFn, elTop, elBottom, elSummary) {
    var ps = state.pageSize;
    var totalPages = Math.max(1, Math.ceil(totalFiltered / ps));
    if (state.current > totalPages) state.current = totalPages;
    var start = (state.current - 1) * ps + 1;
    var end = Math.min(state.current * ps, totalFiltered);
    var displayStart = totalFiltered === 0 ? 0 : start;

    elSummary.textContent = "共 " + totalAll + " 筆，符合篩選 " + totalFiltered + " 筆，本頁顯示第 " + displayStart + "–" + end + " 筆";

    [elTop, elBottom].forEach(function (el) {
      clearElement(el);

      // first page
      var btnFirst = document.createElement("button");
      btnFirst.textContent = "«";
      btnFirst.title = "第一頁";
      btnFirst.disabled = state.current <= 1;
      btnFirst.addEventListener("click", function () { state.current = 1; renderFn(); });
      el.appendChild(btnFirst);

      // prev
      var btnPrev = document.createElement("button");
      btnPrev.textContent = "上一頁";
      btnPrev.disabled = state.current <= 1;
      btnPrev.addEventListener("click", function () { state.current--; renderFn(); });
      el.appendChild(btnPrev);

      // page info
      var info = document.createElement("span");
      info.className = "page-info";
      info.textContent = "第 " + state.current + " / " + totalPages + " 頁";
      el.appendChild(info);

      // next
      var btnNext = document.createElement("button");
      btnNext.textContent = "下一頁";
      btnNext.disabled = state.current >= totalPages;
      btnNext.addEventListener("click", function () { state.current++; renderFn(); });
      el.appendChild(btnNext);

      // last page
      var btnLast = document.createElement("button");
      btnLast.textContent = "»";
      btnLast.title = "最後一頁";
      btnLast.disabled = state.current >= totalPages;
      btnLast.addEventListener("click", function () { state.current = totalPages; renderFn(); });
      el.appendChild(btnLast);

      // page size selector
      var label = document.createElement("label");
      label.style.fontSize = "12px";
      label.style.color = "#555";
      label.textContent = "每頁 ";
      var sel = document.createElement("select");
      [20, 50, 100].forEach(function (n) {
        var opt = document.createElement("option");
        opt.value = String(n);
        opt.textContent = String(n);
        if (n === state.pageSize) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", function () {
        state.pageSize = parseInt(sel.value, 10);
        state.current = 1;
        renderFn();
      });
      label.appendChild(sel);
      label.appendChild(document.createTextNode(" 筆"));
      el.appendChild(label);
    });

    return { start: start - 1, end: end }; // 0-based slice indices
  }

  // ---- column resize state ----
  // NOTE(ceiling): widths are per-session only (no localStorage persistence; studio.draft could persist later).
  var skillColWidths = {}; // keyed by column index

  function makeColResizable(table, colWidths, headers) {
    // Apply colgroup for fixed layout
    var colgroup = document.createElement("colgroup");
    headers.forEach(function (_, i) {
      var col = document.createElement("col");
      var w = colWidths[i];
      if (w) col.style.width = w + "px";
      colgroup.appendChild(col);
    });
    table.insertBefore(colgroup, table.firstChild);

    // Add drag handles to each th
    var ths = table.tHead.rows[0].cells;
    for (var i = 0; i < ths.length; i++) {
      (function (th, colIndex, cg) {
        var handle = document.createElement("div");
        handle.className = "col-resize-handle";

        var startX, startW;
        handle.addEventListener("mousedown", function (e) {
          e.preventDefault();
          handle.classList.add("dragging");
          startX = e.clientX;
          startW = cg.children[colIndex].offsetWidth || th.offsetWidth;
          document.body.style.userSelect = "none";

          function onMove(ev) {
            var delta = ev.clientX - startX;
            var newW = Math.max(60, startW + delta);
            colWidths[colIndex] = newW;
            cg.children[colIndex].style.width = newW + "px";
          }
          function onUp() {
            handle.classList.remove("dragging");
            document.body.style.userSelect = "";
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
          }
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });

        th.appendChild(handle);
      })(ths[i], i, colgroup);
    }
  }

  // ---- Skills section ----
  var skillRows = [];
  var skillDeepLinkDone = false;

  function renderSkills() {
    var category = document.getElementById("skill-category").value;
    var status = document.getElementById("skill-status").value;
    var keyword = document.getElementById("skill-keyword").value.trim().toLowerCase();
    var filtered = skillRows.filter(function (r) {
      if (category && r.category !== category) return false;
      if (status && (r.status || "") !== status) return false;
      if (keyword) {
        var haystack = [(r.name || ""), (r.description || "")].join(" ").toLowerCase();
        if (haystack.indexOf(keyword) === -1) return false;
      }
      return true;
    });

    var elTop = document.getElementById("skill-pagination-top");
    var elBottom = document.getElementById("skill-pagination-bottom");
    var elSummary = document.getElementById("skill-summary");
    var slice = buildPagination(skillPage, filtered.length, skillRows.length, renderSkills, elTop, elBottom, elSummary);
    var pageRows = filtered.slice(slice.start, slice.end);

    var list = document.getElementById("skill-list");
    clearElement(list);
    var table = document.createElement("table");
    var headers = ["名稱", "類別", "等級", "狀態", "資料更新至", "地區", "說明", "來源"];
    var head = table.createTHead().insertRow();
    headers.forEach(function (label) {
      var th = document.createElement("th"); th.textContent = label; head.appendChild(th);
    });
    var body = table.createTBody();
    pageRows.forEach(function (row) {
      var tr = body.insertRow();
      tr.insertCell().textContent = row.name || "";
      tr.insertCell().textContent = row.category || "";
      tr.insertCell().textContent = row.class || "";
      tr.insertCell().textContent = row.status || "";
      tr.insertCell().textContent = row.data_currency || "";
      tr.insertCell().textContent = row.region || "";
      var tdDesc = tr.insertCell();
      tdDesc.textContent = truncate(row.description || "", 80);
      tdDesc.title = row.description || "";
      // source_url — openExternal
      var tdUrl = tr.insertCell();
      if (row.source_url) {
        var a = document.createElement("span");
        a.className = "ext-link";
        a.title = "示範:有效的個案外部連結(對照:標案範例的官方連結不可用)";
        a.textContent = "🔗 SKILL.md";
        a.addEventListener("click", function (url) {
          return function () { studio.openExternal(url); };
        }(row.source_url));
        tdUrl.appendChild(a);
      }
    });
    list.appendChild(table);
    makeColResizable(table, skillColWidths, headers);

    // handle ?skill= deep link — jump to page containing matched row
    if (!skillDeepLinkDone) {
      var params = new URLSearchParams(location.search);
      var skillName = params.get("skill");
      if (skillName) {
        skillDeepLinkDone = true;
        var matchedIdx = filtered.findIndex(function (r) { return r.name === skillName; });
        if (matchedIdx !== -1) {
          document.getElementById("skill-keyword").value = skillName;
          skillPage.current = 1;
          renderSkills();
        } else {
          var allIdx = skillRows.findIndex(function (r) { return r.name === skillName; });
          if (allIdx !== -1) {
            document.getElementById("skill-keyword").value = skillName;
            skillPage.current = 1;
            renderSkills();
          } else {
            var notice = document.getElementById("skill-notice");
            notice.textContent = "找不到指定的技能: " + skillName;
            notice.hidden = false;
          }
        }
      }
    }
  }

  studio.query(SKILL_BLOCK).then(function (data) {
    skillRows = data.rows || [];
    // build category and status dropdowns
    var cats = Array.from(new Set(skillRows.map(function (r) { return r.category; }).filter(Boolean))).sort();
    var catSel = document.getElementById("skill-category");
    cats.forEach(function (c) {
      var opt = document.createElement("option"); opt.value = c; opt.textContent = c; catSel.appendChild(opt);
    });
    var statuses = Array.from(new Set(skillRows.map(function (r) { return r.status || ""; }).filter(Boolean))).sort();
    var stSel = document.getElementById("skill-status");
    statuses.forEach(function (s) {
      var opt = document.createElement("option"); opt.value = s; opt.textContent = s; stSel.appendChild(opt);
    });
    document.getElementById("skill-keyword").addEventListener("input", function () { skillPage.current = 1; renderSkills(); });
    catSel.addEventListener("change", function () { skillPage.current = 1; renderSkills(); });
    stSel.addEventListener("change", function () { skillPage.current = 1; renderSkills(); });
    renderSkills();
  }).catch(function (err) {
    var el = document.getElementById("skill-summary");
    el.className = "summary error";
    el.textContent = "技能資料載入失敗:" + (err && err.message ? err.message : String(err));
  });

})();
</script>
</body>
</html>
